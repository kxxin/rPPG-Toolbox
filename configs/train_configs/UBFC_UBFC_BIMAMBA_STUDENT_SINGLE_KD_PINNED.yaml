# Single-path 6-block student (no noise path / cross-attention) on the pinned UBFC-rPPG split.
# Pinned UBFC-rPPG protocol (DualPhysMamba Sec. 4.3). Run tools/bimamba/make_pinned_split.py first;
# the trainer verifies the loaded subjects against SPLIT_MANIFESTS. BEGIN/END are ignored when the CSV exists.
BASE: ['']
TOOLBOX_MODE: train_and_test
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 3e-4
  MODEL_FILE_NAME: UBFC_UBFC_BiMambaPhys_StudentSingleKDPinned
  PLOT_LOSSES_AND_LR: True
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: False
    DATA_FORMAT: NCDHW
    DATA_PATH: /home/user/24020695/data/UBFC-rPPG
    CACHED_PATH: /home/user/24020695/PreprocessedData
    FILE_LIST_PATH: /home/user/24020695/PreprocessedData/splits/UBFC-rPPG_intra_train.csv  # pinned: subjects 1-37 (first 30, numeric)
    EXP_DATA_NAME: experiment00
    BEGIN: 0.0
    END: 0.72
    PREPROCESS:
      DATA_TYPE: ['Standardized']
      DATA_AUG: ['None']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: HC
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 128
        W: 128
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: True
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: False
    DATA_FORMAT: NCDHW
    DATA_PATH: /home/user/24020695/data/UBFC-rPPG
    CACHED_PATH: /home/user/24020695/PreprocessedData
    FILE_LIST_PATH: /home/user/24020695/PreprocessedData/splits/UBFC-rPPG_intra_test.csv  # pinned: subjects 38-49 (last 12)
    EXP_DATA_NAME: experiment00
    BEGIN: 0.72
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['Standardized']
      DATA_AUG: ['None']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: HC
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
NUM_WORKERS: 4
LOG:
  PATH: runs/exp/pinned_student6_single_kd
MODEL:
  NAME: BiMambaPhysKD
  BIMAMBAPHYS:
    DUAL_PATH: True
    STAGE1_EPOCHS: 0  # single path: no stage 2
    NOISE_PATH: False  # single-path student: stem + spatial attention + 6 rPPG Bi-Mamba blocks
    DIM: 64
    DEPTH: 6  # Per student path; teacher has 12 per path.
    D_STATE: 16
    D_CONV: 4
    EXPAND: 2
    DROPOUT: 0.1
    MLP_RATIO: 2
    DROP_PATH_RATE: 0.1
    CROSS_ATTN_HEADS: 4
    SPLIT_MANIFESTS: ['/home/user/24020695/PreprocessedData/splits/UBFC-rPPG_intra_manifest.json']
    WEIGHT_DECAY: 0.0005
    GRAD_CLIP: 1.0
    LOSS:
      PEARSON_WEIGHT: 1.0
      WAVE_WEIGHT: 0.5
      FREQUENCY_WEIGHT: 0.1
      MIN_HZ: 0.7
      MAX_HZ: 3.0
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
    WINDOW_SIZE: 10
  MODEL_PATH: ''

DISTILL:
  WEIGHT: 0.5
  # Paths relative to the toolbox root; use the trained teacher run, not the old baseline.
  TEACHER_CHECKPOINT: runs/exp/pinned_dual12_2stage/experiment00/PreTrainedModels/UBFC_UBFC_BiMambaPhys_Dual2StagePinned_Epoch29.pth
  TEACHER_CONFIG: runs/exp/pinned_dual12_2stage/experiment00/PreTrainedModels/resolved_config.yaml
