BASE: ['']
TOOLBOX_MODE: train_and_test # "train_and_test"  or "only_test"
TRAIN:
  BATCH_SIZE: 16
  EPOCHS: 30
  LR: 3e-4
  MODEL_FILE_NAME: UBFC_UBFC_BiMambaPhys
  PLOT_LOSSES_AND_LR: True
  DATA: 
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: False            # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: /home/user/24020695/data/UBFC-rPPG                     # Raw dataset path, need to be updated
    CACHED_PATH: /home/user/24020695/PreprocessedData    # Parent directory; EXP_DATA_NAME is appended
    FILE_LIST_PATH: /home/user/24020695/PreprocessedData/experiment00/experiment00_0.0_0.72.csv    # Path to store file lists, needs to be updated
    EXP_DATA_NAME: experiment00  # Reuse the existing preprocessing cache
    BEGIN: 0.0
    END: 0.72
    PREPROCESS:
      DATA_TYPE: ['Standardized'] #if use BiMambaPhys, should be Standardized
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160  #only support for factor of 512
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
VALID:
  DATA: 
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: False            # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: /home/user/24020695/data/UBFC-rPPG                     # Raw dataset path, need to be updated
    CACHED_PATH: /home/user/24020695/PreprocessedData    # Parent directory; EXP_DATA_NAME is appended
    FILE_LIST_PATH: /home/user/24020695/PreprocessedData/experiment00/experiment00_0.72_1.0.csv   # Path to store file lists, needs to be updated
    EXP_DATA_NAME: experiment00  # Reuse the existing preprocessing cache
    BEGIN: 0.72
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['Standardized'] #if use BiMambaPhys, should be Standardized
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160  #only support for factor of 512
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: True                   # to use provided validation dataset to find the best epoch, should be false
  DATA: 
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: False            # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: /home/user/24020695/data/UBFC-rPPG                     # Raw dataset path, need to be updated
    CACHED_PATH: /home/user/24020695/PreprocessedData    # Parent directory; EXP_DATA_NAME is appended
    FILE_LIST_PATH: /home/user/24020695/PreprocessedData/experiment00/experiment00_0.72_1.0.csv    # Path to store file lists, needs to be updated
    EXP_DATA_NAME: experiment00  # Reuse the existing preprocessing cache
    BEGIN: 0.72
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['Standardized'] #if use BiMambaPhys, should be Standardized
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160  #only support for factor of 512
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp/experiment01  # Separate outputs for the new training experiment
MODEL:
  NAME: BiMambaPhys
  BIMAMBAPHYS:
    DIM: 64
    D_STATE: 16
    D_CONV: 4
    EXPAND: 2
    DROPOUT: 0.1
    WEIGHT_DECAY: 0.0005
    GRAD_CLIP: 1.0
    LOSS:
      PEARSON_WEIGHT: 1.0
      WAVE_WEIGHT: 0.5
      FREQUENCY_WEIGHT: 0.1
      MIN_HZ: 0.7
      MAX_HZ: 3.0
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 10        # In seconds
  MODEL_PATH: ""
